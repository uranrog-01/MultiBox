name: App doesn't work in MultiBox
description: An app won't open, opens the wrong window, shares a login, or won't save.
title: "[App] <app name>: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [FAQ](https://github.com/uranrog-01/MultiBox#faq--troubleshooting) and [What is not separated](https://github.com/uranrog-01/MultiBox#what-is-not-separated) first.
  - type: input
    id: app
    attributes:
      label: App name and version
      placeholder: "e.g. Cline 0.0.48, Discord 1.0.9180"
    validations:
      required: true
  - type: input
    id: path
    attributes:
      label: Where is the app installed?
      description: The folder of the .exe you added. Remove your user name if you like.
      placeholder: "e.g. %LOCALAPPDATA%\\Programs\\Discord or C:\\Program Files\\WindowsApps\\..."
  - type: dropdown
    id: problem
    attributes:
      label: What happens?
      options:
        - It opens my existing window instead of a new copy
        - It doesn't start or closes right away
        - It shows an error (please paste it below)
        - Copies share a login or settings
        - Save or reopen fails
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Steps and error message
      description: What you clicked, in order, and the exact error text. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Save diagnostics (for save problems)
      description: |
        Paste the newest file from `%LOCALAPPDATA%\MultiBox\SaveDiagnostics`. It lists file names and error codes only, never file contents or sign-in data.
      render: json
  - type: input
    id: version
    attributes:
      label: MultiBox version
      description: Settings → bottom left.
      placeholder: "1.0.4"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
