name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build MultiBox.csproj -c Release

      - name: Publish single-file x64
        run: dotnet publish MultiBox.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o out

      - name: Remove developer-only files
        shell: pwsh
        run: Get-ChildItem out -Recurse -Include *.xml, *.pdb | Remove-Item

      - uses: actions/upload-artifact@v4
        with:
          name: MultiBox-win-x64
          path: out
          retention-days: 14
