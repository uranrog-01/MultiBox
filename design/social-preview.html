<!doctype html>

<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }

  .grid { position: absolute; inset: 0; background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at 30% 50%, #000 20%, transparent 75%); }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; gap: 72px; padding: 0 96px; }

<div class="grid"></div>
<div class="wrap">
  <img class="icon" src="icon/multibox-icon.svg" alt="">

    <div class="chips"><span class="chip">Separate logins</span><span class="chip">Save &amp; reopen</span><span class="chip">One-click wipe</span><span class="chip">No admin</span></div>
  </div>
</div>
<div class="foot"><span>Electron · Tauri · WebView2 · Node.js · Bun</span><span>Free &amp; open source · Windows 10 &amp; 11</span></div>
