<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- MultiBox app icon for 16-24 px (tray, title bar, small lists). Every edge is on the 16 px pixel grid. -->
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="#c6fa46"/>
  <rect x="2" y="2" width="8" height="8" rx="2" fill="#14200b"/>
  <rect x="4" y="4" width="4" height="4" rx="0.75" fill="#c6fa46"/>
  <rect x="5" y="5" width="10" height="10" rx="3" fill="#c6fa46"/>
  <rect x="6" y="6" width="8" height="8" rx="2" fill="#14200b"/>
</svg>
